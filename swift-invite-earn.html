/* ============ DEVICE FINGERPRINT ============ */
async function deviceId(){
  const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,navigator.language,navigator.hardwareConcurrency,Intl.DateTimeFormat().resolvedOptions().timeZone,(()=>{try{const c=document.createElement("canvas").getContext("2d");c.font="14px Arial";c.fillText("swift",2,2);return c.canvas.toDataURL()}catch(e){return""}})()].join("|");
  const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw));
  return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function api(action,data={}){
  if(CONFIG.API_BASE){const r=await fetch(CONFIG.API_BASE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,data,initData:tg?.initData||"",device:await deviceId()})});return r.json()}
  return demo(action,data);
}
function demo(a,d){ // local preview storage – use API_BASE for shared multi-user data
  const D=JSON.parse(localStorage.swiftDB4||`{"users":{},"channels":[],"wd":[],"log":[],"set":{"reward":${CONFIG.REWARD},"min":${CONFIG.MIN_WITHDRAW},"minRefs":${CONFIG.MIN_REFS},"tapReward":${CONFIG.TAP_REWARD},"tapBase":${CONFIG.TAP_BASE},"tapStep":${CONFIG.TAP_STEP},"adsPer":${CONFIG.ADS_PER_UPGRADE},"maxLvl":${CONFIG.MAX_TAP_LEVEL}},"devices":{}}`);
  const save=()=>localStorage.swiftDB4=JSON.stringify(D);let u=D.users[TU.id];const S=D.set;
  const out=(o={})=>{save();return{ok:true,user:D.users[TU.id],set:S,channels:D.channels,log:D.log.slice(-15).reverse(),...o}};
  if(a==="init"){if(!u){u=D.users[TU.id]={id:TU.id,name:TU.first_name,bal:0,refs:0,by:null,joined:Date.now(),verified:false,taps:0,tapWin:0,tapLvl:0,adsSeen:0};
    const dev=localStorage.demoDev||(localStorage.demoDev=Math.random().toString(36).slice(2));
    if(D.devices[dev])u.dupe=true;else D.devices[dev]=TU.id;
    if(REF&&REF!=TU.id&&D.users[REF]&&!u.dupe)u.by=REF}return out()}
  if(a==="verify"){u.verified=true;if(u.by&&!u.paid&&D.users[u.by]){D.users[u.by].bal+=S.reward;D.users[u.by].refs++;u.paid=true}return out()}
  if(a==="tap"){const now=Date.now();if(!u.tapWin||now-u.tapWin>=36e5){u.tapWin=now;u.taps=0}const lim=S.tapBase+u.tapLvl*S.tapStep,k=Math.max(0,Math.min(d.n,lim-u.taps));u.taps+=k;u.bal=+(u.bal+k*S.tapReward).toFixed(3);return out()}
  if(a==="adwatch"){if(u.tapLvl>=S.maxLvl)return out();u.adsSeen++;if(u.adsSeen>=S.adsPer){u.adsSeen=0;u.tapLvl++;return out({up:true})}return out()}
  if(a==="log")return out();
  if(a==="withdraw"){if(u.refs<S.minRefs)return{ok:false,msg:t("needref")+S.minRefs};if(u.bal<S.min)return{ok:false,msg:t("minw")+S.min+" "+t("b")};
    D.wd.push({id:Date.now(),uid:u.id,name:u.name,amt:u.bal,addr:d.addr,st:"pending"});u.bal=0;return out()}
  if(a==="board")return out({board:Object.values(D.users).sort((x,y)=>y.refs-x.refs).slice(0,10).map(x=>({name:x.name,refs:x.refs}))});
  if(TU.id!==CONFIG.OWNER_ID)return{ok:false,msg:"Not admin"};
  if(a==="admin")return out({users:Object.values(D.users),wd:D.wd});
  if(a==="addch"){D.channels.push(d.ch);return out()}
  if(a==="delch"){D.channels=D.channels.filter(c=>c!==d.ch);return out()}
  if(a==="set"){Object.assign(S,d);return out({msg:"✔"})}
  if(a==="approve"){const w=D.wd.find(x=>x.id==d.id);w.st="paid";D.log.push({uid:w.uid,name:w.name,amt:w.amt,ts:Date.now()});return out({wd:D.wd,users:Object.values(D.users)})}
  if(a==="reject"){const w=D.wd.find(x=>x.id==d.id);w.st="rejected";D.users[w.uid].bal+=w.amt;return out({wd:D.wd,users:Object.values(D.users)})}
  if(a==="ban"){D.users[d.id].banned=true;return out({wd:D.wd,users:Object.values(D.users)})}
}
